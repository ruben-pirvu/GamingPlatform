<main class="launch-window" aria-labelledby="launch-title">
  <section class="launch-card">
    <p class="eyebrow">Preparing your game</p>
    <h1 id="launch-title">{{ game.title }}</h1>
    <div class="provider-status" role="status" aria-live="polite">
      <span class="provider-spinner" aria-hidden="true"></span>
      <p>Waiting for the external game service...</p>
    </div>
    <p class="launch-note">This window will continue when the provider is connected.</p>
  </section>
</main>
