<main class="games-page">
  <header class="games-header">
    <p class="eyebrow">The game library</p>
    <h1>Find your next favorite</h1>
    <p class="intro">Pick a world to explore. Game artwork is coming soon.</p>
  </header>

  <section class="game-grid" aria-label="Available games">
    @for (game of games; track game.id; let index = $index) {
      <button
        class="game-card"
        [class.selected]="selectedGameId() === game.id"
        [attr.aria-pressed]="selectedGameId() === game.id"
        (click)="selectGame(game.id)"
        type="button"
      >
        <span class="game-artwork" [attr.data-artwork]="index" aria-hidden="true">
          <span class="artwork-caption">Artwork coming soon</span>
          <span class="artwork-orb"></span>
        </span>
        <span class="game-details">
          <span class="game-category">{{ game.category }}</span>
          <span class="game-title">{{ game.title }}</span>
          <span class="game-description">{{ game.description }}</span>
          <span class="card-action">{{ selectedGameId() === game.id ? 'Selected' : 'Choose game' }}</span>
        </span>
      </button>
    }
  </section>

  @if (selectedGame(); as game) {
    <p class="selection-status" role="status">Selected: {{ game.title }}</p>
  }
</main>
