<div class="preflight-result" [class.ready]="state === 'ready'" [class.denied]="state === 'denied'" role="status" aria-live="polite">
  @if (state === 'checking') {
    <span class="preflight-spinner" aria-hidden="true"></span>
    <p>Checking age eligibility...</p>
  } @else if (state === 'ready') {
    <span class="result-icon check-icon" aria-hidden="true">✓</span>
    <p>Game ready to load</p>
  } @else {
    <span class="result-icon cross-icon" aria-hidden="true">×</span>
    <p>Age or account eligibility could not be verified. Returning to game selection...</p>
  }
</div>
